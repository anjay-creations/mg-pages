name: Collect jobs and deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JavaScript
        run: |
          node --check src/app.js
          node --input-type=module --check < src/career.js
          node --input-type=module --check < extension/panel.js
          npm test

      - name: Restore persistent job database
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/restore_database.py

      - name: Collect jobs and archive old listings
        id: collect
        continue-on-error: true
        run: python3 -m backend.pipeline

      - name: Preserve database for the next collection
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: job-database
          path: var/jobs.sqlite3
          retention-days: 7
          if-no-files-found: error

      - name: Stage public website
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report collection errors after publishing preserved results
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'One or more job sources failed. Preserved results and collection health were published.'
          exit 1
